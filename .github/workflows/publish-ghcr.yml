# Publish the multi-arch bridge image to GitHub Container Registry on a release.
#
# Trigger: a published GitHub Release (the release tag names the version), or a manual run.
# Output:  ghcr.io/razzledazzlebazzle/ha-eufy-sdk-bridge:<version> + :latest — one manifest carrying
#          linux/amd64 + linux/arm64 (node:24-alpine has no arm/v7 base).
#
# The SDK installs straight from its GitHub fork at a pinned tag (pulled by `npm ci` in the build via
# its own `prepare` build step), so no separate SDK checkout / build context is needed here either.
# Uses the docker CLI in shell rather than the docker/* marketplace actions — inherited from the
# upstream mega-yfue org's Actions policy (only actions owned by mega-yfue or created by GitHub), which
# doesn't apply to this personal fork, but the docker-CLI approach works fine regardless and there was
# no reason to switch it back. buildx is preinstalled on the runner; arm64 emulation comes from a
# `tonistiigi/binfmt` image pull (an image, not an action). Push uses the built-in GITHUB_TOKEN via
# `packages: write`.
#
# First publish only: GHCR defaults a token-published package to PRIVATE regardless of repo visibility —
# after the first run, go to the package's own Settings on GitHub and set visibility to Public, or an
# anonymous `docker pull` (no `docker login`) will get a bare "denied" with no hint why.
name: Publish image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.2.0). Defaults to package.json."
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/razzledazzlebazzle/ha-eufy-sdk-bridge

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version (release tag must match package.json)
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          VER="${VER#v}"   # tolerate a leading v (v0.2.0 → 0.2.0)
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::release/input version '$VER' does not match package.json '$PKG' — bump package.json to match before releasing"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VER (+ :latest)"

      - name: Enable arm64 emulation (binfmt)
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Create a buildx builder
        run: docker buildx create --use --name eufy-ci --driver docker-container

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the multi-arch manifest
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:${{ steps.v.outputs.version }}" \
            --tag "$IMAGE:latest" \
            --push \
            .

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` · also tagged \`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
